<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - SpiceWorld</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-bold text-orange-600">
                SpiceWorld 🌶️
            </a>
            <div class="hidden md:flex space-x-6">
                <a href="index.html" class="text-gray-700 hover:text-orange-600 font-medium">Home</a>
                <a href="index.html#products" class="text-gray-700 hover:text-orange-600 font-medium">Products</a>
                <a href="contactdetails.html" class="text-gray-700 hover:text-orange-600 font-medium">Contact Us</a>
            </div>
            <!-- Active Cart Icon -->
            <a href="checkout.html" class="relative p-2 rounded-full bg-orange-100 text-orange-600">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                <span class="absolute top-0 right-0 block h-4 w-4 rounded-full bg-orange-600 text-white text-xs text-center">1</span>
            </a>
        </nav>
    </header>

    <main class="flex-grow py-10 px-4">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Complete Your Order</h1>

            <!-- Billing Details Form (Centered, Single Column) -->
            <div class="bg-white p-8 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-6 border-b pb-2">Billing Details</h2>
                <form id="checkout-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Full Name</label>
                        <input type="text" id="billing-name" placeholder="Sahan Jayawardhana" class="w-full p-2 border rounded focus:border-orange-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Email Address</label>
                        <input type="email" placeholder="email@example.com" class="w-full p-2 border rounded focus:border-orange-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Shipping Address</label>
                        <input type="text" placeholder="123 Spice Street, Colombo" class="w-full p-2 border rounded focus:border-orange-500 outline-none" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">City</label>
                            <input type="text" class="w-full p-2 border rounded focus:border-orange-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">Postal Code</label>
                            <input type="text" class="w-full p-2 border rounded focus:border-orange-500 outline-none" required>
                        </div>
                    </div>

                    <h3 class="text-lg font-bold mt-6 mb-4 border-b pb-2">Payment</h3>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Card Number</label>
                        <input type="text" placeholder="0000 0000 0000 0000" class="w-full p-2 border rounded focus:border-orange-500 outline-none" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">Expiry Date</label>
                            <input type="text" placeholder="MM/YY" class="w-full p-2 border rounded focus:border-orange-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">CVV</label>
                            <input type="text" placeholder="123" class="w-full p-2 border rounded focus:border-orange-500 outline-none" required>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700 transition mt-4">
                        Pay Now
                    </button>
                </form>
            </div>

        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-8 text-center">
        <p>&copy; 2025 SpiceWorld. Secure Checkout.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
